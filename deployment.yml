apiVersion: apps/v1
kind: Deployment
metadata:
  name: git-along-deployment
spec:
  replicas: 3
  selector:
    matchLabels:
      app: git-along
  template:
    metadata:
      labels:
        app: git-along
    spec:
      containers:
      - name: git-along-container
        image: nginx:latest
        ports:
        - containerPort: 80
        env:
        - name: ENVIRONMENT
          value: production
        - name: API_URL
          value: https://api.deployment.git-along.com  
        - name: DATABASE_URL
          value: postgres://postgres:postgres@postgres:5432/git_along_db
        - name: LOG_LEVEL
          value: info
        - name: FEATURE_NEW_UI
          value: true
  
          